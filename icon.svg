<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#080810"/>

  <!-- Background scatter -->
  <circle cx="48" cy="38" r="1" fill="#f2ead8" opacity="0.25"/>
  <circle cx="440" cy="55" r="0.9" fill="#f2ead8" opacity="0.2"/>
  <circle cx="32" cy="260" r="1" fill="#f2ead8" opacity="0.2"/>
  <circle cx="475" cy="340" r="0.8" fill="#f2ead8" opacity="0.18"/>
  <circle cx="60" cy="460" r="1" fill="#f2ead8" opacity="0.2"/>
  <circle cx="465" cy="430" r="0.8" fill="#f2ead8" opacity="0.15"/>
  <circle cx="460" cy="180" r="0.9" fill="#f2ead8" opacity="0.18"/>
  <circle cx="90" cy="490" r="0.8" fill="#f2ead8" opacity="0.15"/>

  <!-- S constellation — scaled and centered with 80px padding all sides -->
  <!-- Full S spans x:187-308, y:68-401 in original = 121w x 333h
       Target safe area: 80 to 432 (352w x 352h)
       Scale to fit height: 352/333 = 1.057 — nearly 1:1, just re-center
       Center x of original: (187+308)/2 = 247.5 → target center: 256
       Offset x: 256-247.5 = +8.5
       Center y of original: (68+401)/2 = 234.5 → target center: 256
       Offset y: 256-234.5 = +21.5
       Scale 0.92, then translate to center -->

  <g transform="translate(256,256) scale(0.72) translate(-247,-235)">
    <!-- Connecting lines -->
    <polyline points="308,68 265,92 224,128 218,174 234,219 262,243 295,256 312,291 302,330 273,363 224,389 187,401"
      stroke="#c8b888" stroke-width="2" fill="none" opacity="0.65" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Star 1 — top right, brightest -->
    <circle cx="308" cy="68" r="9" fill="#f2ead8" opacity="0.06"/>
    <circle cx="308" cy="68" r="5" fill="#f2ead8" opacity="0.1"/>
    <circle cx="308" cy="68" r="3" fill="#f2ead8"/>

    <!-- Star 2 -->
    <circle cx="265" cy="92" r="4" fill="#f2ead8" opacity="0.08"/>
    <circle cx="265" cy="92" r="2.2" fill="#f2ead8"/>

    <!-- Star 3 -->
    <circle cx="224" cy="128" r="3.5" fill="#f2ead8" opacity="0.07"/>
    <circle cx="224" cy="128" r="2" fill="#f2ead8"/>

    <!-- Star 4 -->
    <circle cx="218" cy="174" r="1.9" fill="#f2ead8" opacity="0.85"/>

    <!-- Star 5 — crossover -->
    <circle cx="234" cy="219" r="4.5" fill="#f2ead8" opacity="0.08"/>
    <circle cx="234" cy="219" r="2.4" fill="#f2ead8"/>

    <!-- Star 6 -->
    <circle cx="262" cy="243" r="1.8" fill="#f2ead8" opacity="0.85"/>

    <!-- Star 7 -->
    <circle cx="295" cy="256" r="3.5" fill="#f2ead8" opacity="0.07"/>
    <circle cx="295" cy="256" r="2" fill="#f2ead8"/>

    <!-- Star 8 — lower right, bright -->
    <circle cx="312" cy="291" r="5.5" fill="#f2ead8" opacity="0.09"/>
    <circle cx="312" cy="291" r="2.6" fill="#f2ead8"/>

    <!-- Star 9 -->
    <circle cx="302" cy="330" r="1.9" fill="#f2ead8" opacity="0.88"/>

    <!-- Star 10 -->
    <circle cx="273" cy="363" r="3.5" fill="#f2ead8" opacity="0.07"/>
    <circle cx="273" cy="363" r="2" fill="#f2ead8"/>

    <!-- Star 11 -->
    <circle cx="224" cy="389" r="1.9" fill="#f2ead8" opacity="0.85"/>

    <!-- Star 12 — bottom left, bright -->
    <circle cx="187" cy="401" r="7" fill="#f2ead8" opacity="0.08"/>
    <circle cx="187" cy="401" r="4" fill="#f2ead8" opacity="0.07"/>
    <circle cx="187" cy="401" r="2.8" fill="#f2ead8"/>
  </g>
</svg>
